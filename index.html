<!-- @format -->

<!doctype html>
<html lang="ko" data-mode="dark" data-version="0.8.0">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="version" content="0.10.0 (2026-08-05) · 가이드형 워크플로우(PRD→기능명세서→유저플로우→와이어프레임→스튜디오) 도입 및 유저플로우 편집기 추가. index2 → index 통합" />
    <title>WEMB Studio</title>
    <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M50 0H14C6.26801 0 0 6.26801 0 14V50C0 57.732 6.26801 64 14 64H50C57.732 64 64 57.732 64 50V14C64 6.26801 57.732 0 50 0Z" fill="%230D1526"/><path d="M20.7788 39.5703C19.6409 42.3867 21.0016 45.5923 23.818 46.7302C26.6344 47.8681 29.8399 46.5074 30.9778 43.691L38.8446 24.2202C39.9824 21.4038 38.6218 18.1982 35.8054 17.0603C32.989 15.9224 29.7834 17.2831 28.6455 20.0995L20.7788 39.5703Z" fill="%233F64A8"/><path d="M37.1848 39.5703C36.0469 42.3867 37.4076 45.5923 40.224 46.7302C43.0404 47.8681 46.2459 46.5074 47.3838 43.691L55.2506 24.2202C56.3885 21.4038 55.0278 18.1982 52.2114 17.0603C49.395 15.9224 46.1894 17.2831 45.0515 20.0995L37.1848 39.5703Z" fill="%23F16043"/><path d="M20.2397 43.7958C21.3776 46.6122 24.5831 47.9729 27.3995 46.835C30.2159 45.6971 31.5766 42.4915 30.4387 39.6751L22.5719 20.2043C21.4341 17.3879 18.2285 16.0272 15.4121 17.1651C12.5957 18.303 11.235 21.5086 12.3729 24.325L20.2397 43.7958Z" fill="%236BC382"/><circle cx="25.3125" cy="42" r="3" fill="%230D1526"/><path d="M36.6457 43.7958C37.7836 46.6122 40.9891 47.9729 43.8055 46.835C46.6219 45.6971 47.9826 42.4915 46.8447 39.6751L38.978 20.2043C37.8401 17.3879 34.6345 16.0272 31.8181 17.1651C29.0017 18.303 27.641 21.5086 28.7789 24.325L36.6457 43.7958Z" fill="%23F4C559"/><circle cx="42" cy="42" r="3" fill="%230D1526"/></svg>' />
    <!-- 공유 미리보기(OG) — 크롤러는 절대 URL만 인식. 배포 주소가 바뀌면 아래 URL도 함께 수정 -->
    <meta property="og:title" content="WEMB Studio" />
    <meta property="og:description" content="몇 가지 질문에 답하면, 관제 대시보드·디지털 트윈이 자동으로 완성돼요." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hjlee-wemb.github.io/WEMB-Studio/" />
    <meta property="og:image" content="https://hjlee-wemb.github.io/WEMB-Studio/src/og-image03.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <!-- 홈 스타일 — 작업공간과 같은 토큰 위에 런처 · 대화상자만 싣는다(스튜디오 스타일시트는 받지 않는다) -->
    <link rel="stylesheet" href="css/base/tokens.css?v=2" data-app-css />
    <link rel="stylesheet" href="css/base/focus.css?v=1" data-app-css />
    <link rel="stylesheet" href="css/base/toast.css?v=1" data-app-css />
    <link rel="stylesheet" href="css/launcher/launcher.css?v=3" data-app-css />
    <link rel="stylesheet" href="css/base/wireframe-mini.css?v=1" data-app-css />
    <link rel="stylesheet" href="css/base/dialog.css?v=1" data-app-css />
  </head>
  <body>
    <!-- 홈 — 프로젝트 · 폴더 · 휴지통 · 템플릿. 주소 #/projects … #/templates/:slug 는 js/launcher/home.js 가 그린다.
         화면을 열면 작업공간(studio.html?screen=…#/studio)으로 간다. -->
    <div class="flow show" id="flowHome">
      <div class="lc">
        <aside class="lc-side">
          <div class="lc-brand"><img src="src/logo.svg" alt="WEMB" /><b>Studio</b></div>
          <nav class="lc-nav">
            <button class="lc-navi on" data-view="all"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V21h14V9.5" /></svg>전체</button>
            <button class="lc-navi" data-view="recent"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>최근 편집</button>
            <button class="lc-navi" data-view="fav"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.4 4 1.2 6-5.4-3-5.4 3 1.2-6-4.4-4 6-.7z" /></svg>즐겨찾기</button>
            <button class="lc-navi" data-view="trash"><svg viewBox="0 0 24 24"><path d="M3 6h18" /><path d="M8 6V4h8v2" /><path d="M6 6l1 15h10l1-15" /></svg>휴지통</button>
            <button class="lc-navi lc-navsep" data-view="tpl"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M3 9h18" /></svg>템플릿</button>
          </nav>
        </aside>
        <div class="lc-main">
          <button class="lc-back" id="lcBack" type="button" title="뒤로 (이전 화면)" aria-label="뒤로" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6" /></svg>뒤로
          </button>
          <!-- 프로젝트(폴더) 안에 들어왔을 때만 보이는 경로 표시 — 어디에 들어와 있는지 한눈에 -->
          <nav class="lc-crumb" id="lcCrumb" hidden aria-label="위치">
            <button type="button" class="lc-crumb-root" id="lcCrumbRoot">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6" /></svg>
              프로젝트 목록
            </button>
            <span class="lc-crumb-sep" aria-hidden="true">/</span>
            <span class="lc-crumb-cur" id="lcCrumbCur"></span>
          </nav>
          <div class="lc-title" id="lcTitle">전체</div>
          <div class="lc-sub" id="lcCount">프로젝트 0개</div>
          <div class="lc-tools" id="lcTools">
            <button class="lc-new" id="lcNew"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>새 프로젝트</button>
            <button class="lc-new lc-seldel" id="lcSelDel" hidden disabled><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12" /></svg>선택삭제<span class="lc-selcount"></span></button>
            <button class="lc-new lc-emptytrash" id="lcEmptyTrash" hidden><svg viewBox="0 0 24 24"><path d="M3 6h18" /><path d="M8 6V4h8v2" /><path d="M6 6l1 15h10l1-15" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></svg>전체삭제</button>
            <div class="lc-searchwrap" id="lcSearchWrap"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.5" y2="16.5" /></svg><input type="text" id="lcSearch" placeholder="검색" /></div>
          </div>
          <div class="lc-grid" id="lcGrid"></div>
        </div>
      </div>
    </div>

    <!-- ============================================================
         확인 대화상자 — 되돌릴 수 없는 동작 전용.
         전에는 네이티브 window.confirm() 을 썼다. 카피는 좋았지만 디자인된 모달을
         갖춘 도구가 가장 위험한 동작만 OS 대화상자로 처리하고 있었고, 그래서
         '삭제'를 위험색으로 구분하는 것조차 불가능했다.
         초기 초점은 '취소'에 둔다 — Enter 한 번에 영구 삭제가 일어나면 안 된다.
         ============================================================ -->
    <div class="askmodal" id="askModal" hidden>
      <div class="ask" role="dialog" aria-modal="true" aria-labelledby="askTitle" aria-describedby="askBody">
        <h2 class="ask-t" id="askTitle"></h2>
        <div class="ask-b" id="askBody"></div>
        <div class="ask-foot">
          <button type="button" class="ask-btn ghost" id="askNo">취소</button>
          <button type="button" class="ask-btn danger" id="askYes">삭제</button>
        </div>
      </div>
    </div>


    <div class="toastwrap" id="toastWrap" aria-live="polite" aria-atomic="false"></div>

    <!-- 홈 스크립트 — 전역(classic) 스크립트라 아래 순서가 곧 의존 순서다 -->
    <script src="js/core/router.js?v=1"></script>
    <script src="js/core/projects.js?v=1"></script>
    <script src="js/core/layouts.js?v=1"></script>
    <script src="js/launcher/templates.js?v=1"></script>
    <script src="js/ui/toast.js?v=1"></script>
    <script src="js/ui/confirm.js?v=1"></script>
    <script src="js/ui/focus-trap.js?v=2"></script>
    <script src="js/launcher/home.js?v=1"></script>
  </body>
</html>
